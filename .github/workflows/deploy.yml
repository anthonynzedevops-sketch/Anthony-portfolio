name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Deploy and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: eu-north-1
      EC2_INSTANCE_ID: i-0e7496f9d4d0b353e
      EC2_HOST: 13.62.50.97

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate portfolio files
        run: |
          set -euo pipefail

          test -f Dockerfile
          test -f templates/index.html
          test -f static/css/style.css
          test -f static/js/script.js
          test -f static/files/Anthony-Nze-CV.pdf

          grep -q 'static/css/style.css' templates/index.html
          grep -q 'Anthony-Nze-CV.pdf' templates/index.html

          echo "Portfolio validation passed."

      - name: Build Docker image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t anthony-portfolio:ci .

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::431251892590:role/GitHubActions-Portfolio-Deploy-Role
          aws-region: eu-north-1
          role-session-name: GitHubPortfolioDeployment

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy using AWS Systems Manager
        id: deploy
        run: |
          set -euo pipefail

          echo "Sending deployment instruction to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy portfolio commit ${GITHUB_SHA}" \
            --parameters "commands=/usr/local/sbin/deploy-portfolio-from-git ${GITHUB_SHA}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for attempt in {1..120}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|TimedOut|Cancelled)
                echo "Deployment failed."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment did not complete successfully."
            exit 1
          fi

          echo "===== EC2 DEPLOYMENT OUTPUT ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

      - name: Verify public website
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            "http://${EC2_HOST}:8081/"

          echo "Public website health check passed."

      - name: Report deployed commit
        run: |
          echo "Deployment successful."
          echo "Commit deployed: ${GITHUB_SHA}"
          echo "Website: http://${EC2_HOST}:8081"
